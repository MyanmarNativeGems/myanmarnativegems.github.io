name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Repository variable overrides the default. The Sheet URL is
          # intentionally public: it is the public product catalog.
          VITE_GEMS_SHEET_URL: ${{ vars.VITE_GEMS_SHEET_URL || 'https://docs.google.com/spreadsheets/d/15ecCh3G3JogHYwb_rLZlWEFrB3Z3fOH1G5-b7GlFEhQ/gviz/tq?tqx=out:csv&gid=0' }}
          # Repository variable overrides the default. Like the Sheet URL,
          # this is meant to be public: it's embedded in the JS bundle
          # either way, and it only accepts inquiry submissions, nothing
          # sensitive. See scripts/google-apps-script/inquiry-to-sheet.gs.
          VITE_INQUIRY_ENDPOINT_URL: ${{ vars.VITE_INQUIRY_ENDPOINT_URL || 'https://script.google.com/macros/s/AKfycbzawsLUwZcnlbQg1Q8pkoiMTFheETHyGp-KrVUUjlmZ3if9OUNBSbtvWAgvxIns-Jd5/exec' }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
